name: Capture Ultimate Emulator UI

concurrency:
  group: ui-emulator-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/ui-emulator.yml"
      - ".github/scripts/capture-ui.sh"
      - "app/src/main/java/com/jev/probe/KnowledgeActivity.kt"
      - "app/src/main/java/com/jev/probe/ui/RelationshipGraphView.kt"
      - "app/src/main/java/com/jev/probe/overlay/OverlayController.kt"
      - "app/src/main/java/com/jev/probe/capture/ChatCaptureService.kt"
      - "app/src/main/java/com/jev/probe/capture/ocr/OcrChatGrouper.kt"
      - "app/src/main/java/com/jev/probe/jev/JevClient.kt"
      - "app/src/main/java/com/jev/probe/jev/RelationshipStrategyPolicy.kt"
      - "app/src/main/java/com/jev/probe/core/Prefs.kt"
      - "app/src/main/java/com/jev/probe/SettingsActivity.kt"
      - "app/src/debug/**"
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build x86_64 debug APK for emulator
        run: |
          sed -i 's/abiFilters += listOf("arm64-v8a")/abiFilters += listOf("x86_64")/' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/AndroidManifest.xml")
          s = p.read_text()
          s = s.replace('android:name=".SettingsActivity"\n            android:exported="false"',
                        'android:name=".SettingsActivity"\n            android:exported="true"')
          s = s.replace('android:name=".KnowledgeActivity"\n            android:exported="false"',
                        'android:name=".KnowledgeActivity"\n            android:exported="true"')
          p.write_text(s)
          PY
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Run emulator and capture screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/capture-ui.sh

      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-ultimate-emulator-screenshots
          path: screenshots/*.png
          if-no-files-found: error
