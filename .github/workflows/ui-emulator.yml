name: Android 15 Emulator Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "integration-fixture/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/scripts/capture-ui.sh"
      - ".github/workflows/ui-emulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "integration-fixture/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/scripts/capture-ui.sh"
      - ".github/workflows/ui-emulator.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JEV_ABI: x86_64
      JEV_INTEGRATION_FIXTURES: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Jev and messenger fixtures
        run: |
          chmod +x ./gradlew
          ./gradlew \
            :app:assembleDebug \
            :integration-fixture:assembleQqDebug \
            :integration-fixture:assembleWechatDebug \
            :integration-fixture:assembleFeishuDebug \
            :integration-fixture:assembleTwitterDebug \
            --stacktrace

      - name: Run Android 15 integration regression
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/capture-ui.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-ultimate-emulator-evidence
          path: |
            screenshots/*.png
            integration-results/*.txt
          if-no-files-found: warn
          retention-days: 30
