name: Android 15 Emulator Regression

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "integration-fixture/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/scripts/capture-ui.sh"
      - ".github/workflows/ui-emulator.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "integration-fixture/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/scripts/capture-ui.sh"
      - ".github/workflows/ui-emulator.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      JEV_ABI: x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Jev and messenger fixtures
        run: |
          chmod +x ./gradlew
          ./gradlew             :app:assembleDebug             :integration-fixture:assembleQqDebug             :integration-fixture:assembleWechatDebug             --stacktrace

      - name: Run Android 15 integration regression
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash .github/scripts/capture-ui.sh

      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-ultimate-emulator-evidence
          path: |
            screenshots/*.png
            integration-results/*.txt
          if-no-files-found: error
          retention-days: 30
