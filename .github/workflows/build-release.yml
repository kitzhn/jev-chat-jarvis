name: Build Signed Ultimate Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（留空则自动使用 app versionName，如 v2.5.1）"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare release signing
        shell: bash
        env:
          JEV_RELEASE_BUNDLE_B64: ${{ secrets.JEV_RELEASE_BUNDLE_B64 }}
          JEV_KEYSTORE_B64: ${{ secrets.JEV_KEYSTORE_B64 }}
          JEV_STORE_PASSWORD: ${{ secrets.JEV_STORE_PASSWORD }}
          JEV_KEY_ALIAS: ${{ secrets.JEV_KEY_ALIAS }}
          JEV_KEY_PASSWORD: ${{ secrets.JEV_KEY_PASSWORD }}
        run: |
          if [ -n "$JEV_RELEASE_BUNDLE_B64" ]; then
            printf '%s' "$JEV_RELEASE_BUNDLE_B64" | base64 --decode > "$RUNNER_TEMP/jev-release-bundle.json"
            python3 -c 'import json,base64,os; p=os.environ["RUNNER_TEMP"]; b=json.load(open(p+"/jev-release-bundle.json",encoding="utf-8")); req=("keystoreB64","storePassword","keyAlias","keyPassword"); missing=[k for k in req if not b.get(k)]; (missing and (_ for _ in ()).throw(SystemExit("Signing bundle missing: "+", ".join(missing)))); open(p+"/jev-ultimate.keystore","wb").write(base64.b64decode(b["keystoreB64"])); open(p+"/jev-release.properties","w",encoding="utf-8").write("storeFile="+p+"/jev-ultimate.keystore\nstorePassword="+b["storePassword"]+"\nkeyAlias="+b["keyAlias"]+"\nkeyPassword="+b["keyPassword"]+"\n")'
            rm -f "$RUNNER_TEMP/jev-release-bundle.json"
            echo "Using JEV_RELEASE_BUNDLE_B64"
          else
            missing=0
            for name in JEV_KEYSTORE_B64 JEV_STORE_PASSWORD JEV_KEY_ALIAS JEV_KEY_PASSWORD; do
              if [ -z "${!name}" ]; then
                echo "::error::Missing repository secret: $name"
                missing=1
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "::error::Set JEV_RELEASE_BUNDLE_B64 (recommended) or the four legacy signing secrets."
              exit 1
            fi
            echo "$JEV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jev-ultimate.keystore"
            cat > "$RUNNER_TEMP/jev-release.properties" <<EOF
          storeFile=$RUNNER_TEMP/jev-ultimate.keystore
          storePassword=$JEV_STORE_PASSWORD
          keyAlias=$JEV_KEY_ALIAS
          keyPassword=$JEV_KEY_PASSWORD
          EOF
          fi

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed release APK
        env:
          JEV_KEYSTORE_PROPS: ${{ runner.temp }}/jev-release.properties
          JEV_ABI: arm64-v8a
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release files
        id: release_meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" || (echo "Unable to read versionName" && exit 1)
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then
            if [ "$REF_TYPE" = "tag" ]; then TAG="$REF_NAME"; else TAG="v$VERSION"; fi
          fi
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match app version v$VERSION"
            exit 1
          fi

          cp app/build/outputs/apk/release/app-release.apk jev-ultimate-arm64.apk
          sha256sum jev-ultimate-arm64.apk > jev-ultimate-arm64.apk.sha256

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jev-ultimate-release
          path: |
            jev-ultimate-arm64.apk
            jev-ultimate-arm64.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; bump the version instead of replacing a published APK"
            exit 1
          else
            gh release create "$TAG"               jev-ultimate-arm64.apk               jev-ultimate-arm64.apk.sha256               --title "Jev Ultimate $VERSION"               --notes "Jev Ultimate $VERSION 正式签名版。Android 11+，ARM64。建议从此 Release 安装和更新；SHA-256 校验文件随 APK 一并提供。"               --latest
          fi

      - name: Show stable download links
        shell: bash
        run: |
          echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/jev-ultimate-arm64.apk"
