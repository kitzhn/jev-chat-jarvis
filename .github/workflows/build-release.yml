name: Build Signed Ultimate Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag（留空则自动使用 app versionName，如 v2.4.0）"
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-release.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Validate signing secrets
        shell: bash
        env:
          JEV_KEYSTORE_B64: ${{ secrets.JEV_KEYSTORE_B64 }}
          JEV_STORE_PASSWORD: ${{ secrets.JEV_STORE_PASSWORD }}
          JEV_KEY_ALIAS: ${{ secrets.JEV_KEY_ALIAS }}
          JEV_KEY_PASSWORD: ${{ secrets.JEV_KEY_PASSWORD }}
        run: |
          test -n "$JEV_KEYSTORE_B64" || (echo "Missing JEV_KEYSTORE_B64" && exit 1)
          test -n "$JEV_STORE_PASSWORD" || (echo "Missing JEV_STORE_PASSWORD" && exit 1)
          test -n "$JEV_KEY_ALIAS" || (echo "Missing JEV_KEY_ALIAS" && exit 1)
          test -n "$JEV_KEY_PASSWORD" || (echo "Missing JEV_KEY_PASSWORD" && exit 1)

      - name: Prepare release keystore
        shell: bash
        env:
          JEV_KEYSTORE_B64: ${{ secrets.JEV_KEYSTORE_B64 }}
          JEV_STORE_PASSWORD: ${{ secrets.JEV_STORE_PASSWORD }}
          JEV_KEY_ALIAS: ${{ secrets.JEV_KEY_ALIAS }}
          JEV_KEY_PASSWORD: ${{ secrets.JEV_KEY_PASSWORD }}
        run: |
          echo "$JEV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/jev-ultimate.keystore"
          cat > "$RUNNER_TEMP/jev-release.properties" <<EOF
          storeFile=$RUNNER_TEMP/jev-ultimate.keystore
          storePassword=$JEV_STORE_PASSWORD
          keyAlias=$JEV_KEY_ALIAS
          keyPassword=$JEV_KEY_PASSWORD
          EOF

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build signed release APK
        env:
          JEV_KEYSTORE_PROPS: ${{ runner.temp }}/jev-release.properties
          JEV_ABI: arm64-v8a
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Prepare release files
        id: release_meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          VERSION="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          test -n "$VERSION" || (echo "Unable to read versionName" && exit 1)
          TAG="$INPUT_TAG"
          if [ -z "$TAG" ]; then TAG="v$VERSION"; fi

          cp app/build/outputs/apk/release/app-release.apk jev-ultimate-arm64.apk
          sha256sum jev-ultimate-arm64.apk > jev-ultimate-arm64.apk.sha256

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-ultimate-release
          path: |
            jev-ultimate-arm64.apk
            jev-ultimate-arm64.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release_meta.outputs.tag }}
          VERSION: ${{ steps.release_meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               jev-ultimate-arm64.apk               jev-ultimate-arm64.apk.sha256               --clobber
            gh release edit "$TAG"               --title "Jev Ultimate $VERSION"               --latest
          else
            gh release create "$TAG"               jev-ultimate-arm64.apk               jev-ultimate-arm64.apk.sha256               --title "Jev Ultimate $VERSION"               --notes "Jev Ultimate $VERSION 正式签名版。Android 11+，ARM64。建议从此 Release 安装和更新；SHA-256 校验文件随 APK 一并提供。"               --latest
          fi

      - name: Show stable download links
        shell: bash
        run: |
          echo "Release page: https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          echo "APK: https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/jev-ultimate-arm64.apk"
