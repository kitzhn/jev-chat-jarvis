name: Temporary history cleanup
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: temporary-history-cleanup
  cancel-in-progress: false
jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - name: Check out all repository history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Rewrite and publish approved commit identity cleanup
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r remote_ref; do
            [[ "$remote_ref" == "origin/HEAD" ]] && continue
            local_branch="${remote_ref#origin/}"
            git branch --force "$local_branch" "$remote_ref"
          done < <(git for-each-ref --format='%(refname:short)' refs/remotes/origin)

          target_sha="caaf3322d3799652ad16189f5366d68fb7c79c98"
          target_email="$(git show -s --format=%ae "$target_sha")"
          if [[ -z "$target_email" ]]; then
            echo "Could not derive the identity from the approved historical reference."
            exit 1
          fi
          export target_email
          export replacement_email="224992667+kitzhn@users.noreply.github.com"

          git filter-branch -f --env-filter '
            if [ "${GIT_AUTHOR_EMAIL:-}" = "$target_email" ]; then
              GIT_AUTHOR_EMAIL="$replacement_email"
              export GIT_AUTHOR_EMAIL
            fi
            if [ "${GIT_COMMITTER_EMAIL:-}" = "$target_email" ]; then
              GIT_COMMITTER_EMAIL="$replacement_email"
              export GIT_COMMITTER_EMAIL
            fi
          ' -- --all

          remaining=0
          while IFS= read -r ref; do
            if git log "$ref" --format='%ae%n%ce' | grep -Fqx "$target_email"; then
              remaining=1
            fi
          done < <(git for-each-ref --format='%(refname)' refs/heads refs/tags)
          if [[ "$remaining" -ne 0 ]] || git for-each-ref --format='%(taggeremail)' refs/tags | grep -Fqx "$target_email"; then
            echo "A reachable branch or tag still contains the target identity."
            exit 1
          fi

          git push --atomic --force origin '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

          git for-each-ref --format='delete %(refname)' refs/original | git update-ref --stdin
          git reflog expire --expire=now --all
          git gc --prune=now

          git rm .github/workflows/rewrite-history-once.yml
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: remove temporary history cleanup workflow'
          git push origin HEAD:refs/heads/main

          git tag -a v2.5.0 -m 'Jev Ultimate 2.5.0'
          git push origin refs/tags/v2.5.0
