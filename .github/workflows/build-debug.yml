name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-debug.yml"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/build-debug.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JEV_ABI: arm64-v8a

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build app debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleDebug --stacktrace

      - name: Verify CI controls are not exported
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          "${ANDROID_HOME}/cmdline-tools/latest/bin/apkanalyzer" manifest print "$APK" > /tmp/manifest.xml
          python3 - <<'PY'
          import re
          m=open("/tmp/manifest.xml", encoding="utf-8").read()
          for name in [
              "com.jev.probe.IntegrationSetupActivity",
              "com.jev.probe.IntegrationCommandReceiver",
              "com.jev.probe.OverlayDemoActivity",
              "com.jev.probe.WeChatOcrDemoActivity",
              "com.jev.probe.AdaptiveModelDemoActivity",
              "com.jev.probe.IntegrationMatrixDemoActivity",
          ]:
              hit=re.search(r'<(?:activity|receiver)[^>]*android:name="'+re.escape(name)+r'"[^>]*>', m)
              if hit and 'android:exported="true"' in hit.group(0):
                  raise SystemExit(f"unsafe exported debug component: {name}")
          print("PASS: ordinary Debug exposes no CI/test-only component")
          PY

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jev-ultimate-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
